server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gas-station-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gas_station?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.gasstation: debug

gas:
  jwt:
    # 生产环境请修改，并使用环境变量注入
    secret: gas-station-default-secret-please-change
    expire-hours: 72
  wx:
    # 未配置 appid/secret 时，小程序登录自动降级为 mock 登录
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
  order:
    # 订单未支付自动取消时间（分钟）
    unpaid-expire-minutes: 15
