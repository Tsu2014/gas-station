spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:gas_station}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.gasstation: info
  file:
    name: /opt/gas-station/logs/gas-station-server.log

gas:
  jwt:
    secret: ${JWT_SECRET:gas-station-default-secret-please-change}
    expire-hours: 72
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
  order:
    unpaid-expire-minutes: 15
